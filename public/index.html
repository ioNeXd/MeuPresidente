<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compartilhar Tela</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: #9aa0ab; margin: 0 0 20px; font-size: 0.9rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 8px;
    background: #1f232c; cursor: pointer; border: 1px solid #2a2e38;
    font-size: 0.9rem;
  }
  .tab.active { background: #3b5bfd; border-color: #3b5bfd; color: #fff; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 6px; color: #b7bcc7; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2a2e38; background: #0f1115; color: #fff; font-size: 1rem;
  }
  button.primary {
    width: 100%; margin-top: 20px; padding: 12px; border: none;
    border-radius: 8px; background: #3b5bfd; color: #fff; font-size: 1rem;
    cursor: pointer;
  }
  button.primary:hover { background: #2f4bdb; }
  button.primary:disabled { background: #333844; cursor: not-allowed; }
  .room-info {
    margin-top: 20px; padding: 14px; background: #0f1115;
    border-radius: 8px; border: 1px solid #2a2e38; font-size: 0.95rem;
  }
  .room-info b { color: #3b5bfd; font-size: 1.2rem; letter-spacing: 2px; }
  video {
    width: 100%; border-radius: 8px; background: #000; margin-top: 16px;
    display: none;
  }
  #viewerVideoWrap { position: relative; }
  .video-controls {
    display: flex; gap: 8px; margin-top: 10px; justify-content: center;
  }
  .ctrl-btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid #2a2e38;
    background: #1f232c; color: #e6e6e6; font-size: 0.85rem; cursor: pointer;
  }
  .ctrl-btn:hover { background: #2a2e38; }
  .ctrl-btn.active { background: #3b5bfd; border-color: #3b5bfd; color: #fff; }

  /* Modo teatro: expande o card pra ocupar a tela, com o vídeo bem maior */
  body.theater-mode {
    align-items: flex-start;
    padding: 16px;
  }
  body.theater-mode .card {
    max-width: 1200px;
    width: 100%;
  }
  body.theater-mode video {
    max-height: 80vh;
    object-fit: contain;
  }
  body.theater-mode .tabs,
  body.theater-mode #hostPanel > label,
  body.theater-mode #hostPanel > input,
  body.theater-mode #viewerPanel > label,
  body.theater-mode #viewerPanel > input,
  body.theater-mode #btnJoinRoom {
    display: none;
  }
  .status { font-size: 0.85rem; color: #9aa0ab; margin-top: 10px; min-height: 18px; }
  .status.error { color: #ff6b6b; }
  .status.ok { color: #4ade80; }
  .hidden { display: none !important; }
  .viewers-list { margin-top: 12px; font-size: 0.85rem; color: #9aa0ab; }
</style>
</head>
<body>

<div class="card">
  <h1>🖥️ Compartilhamento de Tela</h1>
  <p class="sub">Protótipo P2P via WebRTC — crie uma sala ou entre com um ID</p>

  <div class="tabs">
    <div class="tab active" id="tabHost">Compartilhar (Host)</div>
    <div class="tab" id="tabViewer">Assistir (Viewer)</div>
  </div>

  <!-- HOST -->
  <div id="hostPanel">
    <label>Senha da sala</label>
    <input id="hostPassword" type="password" placeholder="Defina uma senha" />
    <button class="primary" id="btnCreateRoom">Iniciar compartilhamento</button>

    <div class="room-info hidden" id="hostRoomInfo">
      ID da sala: <b id="roomIdDisplay"></b>
      <div class="viewers-list" id="viewersList">Nenhum espectador ainda.</div>
    </div>

    <video id="hostPreview" autoplay muted></video>
    <div class="status" id="hostStatus"></div>
  </div>

  <!-- VIEWER -->
  <div id="viewerPanel" class="hidden">
    <label>ID da sala</label>
    <input id="viewerRoomId" type="text" placeholder="Ex: 7F3K9A" style="text-transform:uppercase" />
    <label>Senha</label>
    <input id="viewerPassword" type="password" placeholder="Senha da sala" />
    <button class="primary" id="btnJoinRoom">Entrar na sala</button>

    <div id="viewerVideoWrap">
      <video id="viewerVideo" autoplay></video>
      <div class="video-controls hidden" id="viewerControls">
        <button class="ctrl-btn" id="btnTheater" title="Modo teatro">🎬 Teatro</button>
        <button class="ctrl-btn" id="btnFullscreen" title="Tela cheia">⛶ Tela cheia</button>
        <button class="ctrl-btn" id="btnMini" title="Miniatura (janela flutuante)">🗗 Miniatura</button>
      </div>
    </div>
    <div class="status" id="viewerStatus"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
